[package]
name = "critical_point"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
bevy = "0.18.1"
astra_voxel_world = { path = "crates/astra_voxel_world" }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
